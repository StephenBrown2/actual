name: Build Edge Docker Image (Fork)

# Edge Docker images for forks - pushes to GHCR only (no Docker Hub)
# Runs on every push to main in a fork, or via workflow_dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: docker-edge-fork
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  # Creates the following tags:
  # - actual-server:edge
  TAGS: |
    type=edge,value=edge
    type=sha

jobs:
  build:
    if: github.event.repository.fork
    name: Build Docker image (fork)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set image owner (lowercase for GHCR)
        id: owner
        run: |
          repo=${GITHUB_REPOSITORY,,}
          echo "repo=${repo}" >> $GITHUB_OUTPUT
          echo "owner=${repo%/*}" >> $GITHUB_OUTPUT

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ghcr.io/${{ steps.owner.outputs.repo }}-server
          flavor: suffix=-alpine
          tags: ${{ env.TAGS }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Building outside of the docker image allows us to build once and push to multiple platforms
      # This is faster and avoids yarn memory issues
      - name: Set up environment
        uses: ./.github/actions/setup
        with:
          # Skip setup's translation checkout - GITHUB_TOKEN from forks has limited
          # cross-repo access. package-browser will clone translations itself via git.
          download-translations: false
      - name: Build Web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: yarn build:server

      - name: Build image for testing
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          file: packages/sync-server/docker/alpine.Dockerfile
          tags: actual-server-testing

      - name: Test that the docker image boots
        run: |
          docker run --detach --network=host actual-server-testing
          sleep 5
          curl --fail -sS -LI -w '%{http_code}\n' --retry 10 --retry-delay 1 --retry-connrefused localhost:5006

      # This will use the cache from the earlier build step and not rebuild the image
      # https://docs.docker.com/build/ci/github-actions/test-before-push/
      - name: Build and push images
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          file: packages/sync-server/docker/alpine.Dockerfile
          platforms: linux/amd64 #,linux/arm64,linux/arm/v7,linux/arm/v6
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}

      - name: Set up flyctl
        if: github.event_name != 'pull_request'
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master

      - name: Deploy to Fly.io
        if: github.event_name != 'pull_request'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: ${{ vars.FLY_APP }}
          FLY_IMAGE: ${{ vars.FLY_IMAGE }}
          FLY_DEPLOY_EXTRA_ARGS: ${{ vars.FLY_DEPLOY_EXTRA_ARGS }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ] || [ -z "${FLY_APP}" ] || [ -z "${FLY_IMAGE}" ]; then
            echo "Skipping Fly.io deploy: set secret FLY_API_TOKEN and variables FLY_APP and FLY_IMAGE on this repository."
            exit 0
          fi
          if [ -n "${FLY_DEPLOY_EXTRA_ARGS}" ]; then
            # shellcheck disable=SC2086
            flyctl deploy --app "${FLY_APP}" --image "${FLY_IMAGE}" --remote-only --no-cache --yes ${FLY_DEPLOY_EXTRA_ARGS}
          else
            flyctl deploy --app "${FLY_APP}" --image "${FLY_IMAGE}" --remote-only --no-cache --yes
          fi
